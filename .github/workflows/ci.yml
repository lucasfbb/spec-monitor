name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Testes
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  imagens:
    # Build sempre (valida os Dockerfiles); push das duas imagens só na main.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            image: spec-monitor-backend
          - name: frontend
            context: ./frontend
            image: spec-monitor-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (e push na main) — ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Atualiza o stack no homelab assim que as imagens novas sobem no GHCR.
    # Roda no self-hosted runner instalado no servidor (ver docs/deploy.md),
    # então não precisa de IP público: o runner faz conexão de saída ao GitHub.
    # Só na main e só depois do build/push das imagens.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [imagens]
    runs-on: [self-hosted, homelab]
    permissions:
      packages: read
    concurrency:
      # Nunca dois deploys ao mesmo tempo; um novo push cancela o anterior.
      group: deploy-homelab
      cancel-in-progress: false
    steps:
      - name: Login no GHCR (imagens privadas)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Atualizar o stack
        run: |
          set -euo pipefail
          cd "$HOME/spec-monitor"                 # clone fixo com o .env (fora do git)
          git fetch --prune origin main
          git reset --hard origin/main            # traz compose/Caddyfile novos; não toca no .env (gitignored)
          docker compose -p spec-monitor -f docker-compose.prod.yml pull
          docker compose -p spec-monitor -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f                   # remove imagens antigas órfãs
