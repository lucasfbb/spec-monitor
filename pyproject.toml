[project]
name = "spec-monitor"
version = "0.1.0"
description = "Monitor de specs e STATUS de projetos spec-driven, para homelab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "markdown>=3.6",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # Teto por reprodutibilidade: sem ele o CI instala a última a cada rodada e
    # muda de regra sozinho (a 0.16 promoveu PIE810/RUF100 ao padrão e deixou o
    # CI vermelho sem ninguém ter tocado no código). Subir o teto é decisão
    # deliberada, junto com a adequação às regras novas.
    "ruff>=0.6,<0.16",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
