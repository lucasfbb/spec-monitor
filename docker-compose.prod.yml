# Homelab: usa as imagens publicadas pelo CI no GHCR (sem build no servidor).
# Guia completo: docs/deploy.md
#   1. docker login ghcr.io (imagens privadas — PAT com read:packages)
#   2. Crie o .env (copie do .env.example e preencha, inclusive POSTGRES_PASSWORD)
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. Aponte um hostname do Cloudflare Tunnel para http://localhost:8111
#      (o Caddy junta frontend + API numa origem só — ver docs/webhook e deploy).
#
# Atualização: docker compose -f docker-compose.prod.yml pull && up -d
# (ou descomente o watchtower no fim do arquivo).
services:
  caddy:
    image: caddy:2-alpine
    ports:
      # host:container — troque a 8111 se colidir com outro serviço do homelab.
      - "8111:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ghcr.io/lucasfbb/spec-monitor-backend:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://specmonitor:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/specmonitor
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Só serviços com este label são atualizados pelo watchtower (abaixo).
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  frontend:
    image: ghcr.io/lucasfbb/spec-monitor-frontend:latest
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: specmonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: specmonitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Atualização automática: confere o GHCR a cada 5 min e, se houver imagem
  # nova de backend/frontend, puxa e recria só esses containers.
  #   --label-enable  → age SÓ nos serviços com o label watchtower.enable=true
  #                     (não toca nos seus outros containers do homelab).
  #   --cleanup       → remove a imagem antiga após atualizar (economiza disco).
  # Auth no GHCR (imagens privadas): monta o config.json do seu `docker login`.
  # Ajuste DOCKER_CONFIG_DIR no .env se o login estiver em /root/.docker
  # (ex.: se você usa `sudo docker`). Default: ~/.docker do usuário atual.
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro
    command: --label-enable --cleanup --interval 300
    restart: unless-stopped

volumes:
  pgdata:
